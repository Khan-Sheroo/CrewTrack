{% extends "base.html" %}

{% block title %}Reset Password - CrewTrack{% endblock %}

{% block extra_css %}
<style>
    .auth-wrap {
        max-width: 420px;
        margin: 2rem auto;
    }
    .auth-card .card-body {
        padding: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="fas fa-lock fa-2x text-primary mb-2"></i>
                <h4 class="mb-1">Choose a new password</h4>
                <p class="text-muted small mb-0">Enter and confirm your new password below.</p>
            </div>

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="new-password" minlength="8" required autofocus>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm new password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-check me-2"></i>Update Password
                </button>
            </form>

            <p class="text-center text-muted small mb-0">
                <a href="{{ url_for('login') }}">Back to sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
