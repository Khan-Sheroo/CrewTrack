<div class="mb-3">
    <label for="staff_name" class="form-label">Staff Name</label>
    <input type="text" class="form-control" id="staff_name" name="name" required maxlength="100" placeholder="Enter staff member's name">
</div>
<div class="mb-3">
    <label for="staff_id_number" class="form-label">ID Number</label>
    <input type="text" class="form-control" id="staff_id_number" name="id_number" maxlength="30" placeholder="Optional staff ID">
</div>
<div class="mb-3">
    <label for="staff_category" class="form-label">Category</label>
    <select class="form-select" id="staff_category" name="category" required>
        <option value="">Select a category...</option>
        {% for category in staff_categories %}
        <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
        <option value="__new__">+ Create new category...</option>
    </select>
</div>
<div class="mb-3" id="new_category_group" style="display: none;">
    <label for="staff_new_category" class="form-label">New Category Name</label>
    <input type="text" class="form-control" id="staff_new_category" name="new_category" maxlength="50">
</div>
<div class="mb-3">
    <label for="staff_rate_type" class="form-label">Rate Type</label>
    <select class="form-select" id="staff_rate_type" name="rate_type" required>
        <option value="monthly">Monthly</option>
        <option value="daily">Daily</option>
        <option value="hourly">Hourly</option>
    </select>
</div>
<div class="mb-3">
    <label for="staff_rate_amount" class="form-label">Rate Amount ({{ currency_code }})</label>
    <input type="number" class="form-control" id="staff_rate_amount" name="rate_amount" required min="0.01" step="0.01">
</div>
<div class="mb-3" id="flat_monthly_group">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="staff_flat_monthly" name="flat_monthly">
        <label class="form-check-label" for="staff_flat_monthly">Flat monthly rate</label>
    </div>
</div>
