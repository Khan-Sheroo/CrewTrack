{% extends "base.html" %}

{% block title %}Sign In - CrewTrack{% endblock %}

{% block extra_css %}
<style>
    .auth-wrap {
        max-width: 420px;
        margin: calc(2rem + 10px) auto 2rem;
    }
    .auth-card .card-body {
        padding: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="fas fa-tachometer-alt fa-2x text-primary mb-2"></i>
                <h4 class="mb-1">Sign in to CrewTrack</h4>
                <p class="text-muted small mb-0">Staff time and wage tracking</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           autocomplete="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                    <div class="form-text text-end">
                        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>

            <p class="text-center text-muted small mb-0">
                No account?
                <a href="{{ url_for('register') }}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
